<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gettu Betur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
  <div class="innskraning-box">
    <h1><span style="color:var(--litur-had)">Gettu</span> Betur</h1>
    <p class="undirtitill">Skráðu þig inn til að taka þátt</p>

    <div class="flipar">
      <button type="button" id="flipInn" class="virkur">Innskráning</button>
      <button type="button" id="flipSkra">Nýskráning</button>
    </div>

    <form id="innskraningForm">
      <label for="innEmail">Netfang</label>
      <input type="email" id="innEmail" required autocomplete="email">
      <label for="innPassword">Lykilorð</label>
      <input type="password" id="innPassword" required autocomplete="current-password">
      <button type="submit" class="aðal-hnappur">Skrá inn</button>
    </form>

    <form id="skraningForm" hidden>
      <label for="skraNafn">Nafn / liðsheiti</label>
      <input type="text" id="skraNafn" required autocomplete="name">
      <label for="skraEmail">Netfang</label>
      <input type="email" id="skraEmail" required autocomplete="email">
      <label for="skraPassword">Lykilorð</label>
      <input type="password" id="skraPassword" required minlength="6" autocomplete="new-password">
      <button type="submit" class="aðal-hnappur">Nýskrá</button>
    </form>

    <p class="villuskilabod" id="villuskilabod"></p>
  </div>
</main>

<script type="module">
  import { skraInn, skra, vaktaInnskraningu } from "./js/auth.js";

  vaktaInnskraningu({ requireAuth: false }, (user) => {
    if (user) window.location.href = "leikur.html";
  });

  const flipInn = document.getElementById("flipInn");
  const flipSkra = document.getElementById("flipSkra");
  const innskraningForm = document.getElementById("innskraningForm");
  const skraningForm = document.getElementById("skraningForm");
  const villuskilabod = document.getElementById("villuskilabod");

  flipInn.addEventListener("click", () => {
    flipInn.classList.add("virkur");
    flipSkra.classList.remove("virkur");
    innskraningForm.hidden = false;
    skraningForm.hidden = true;
    villuskilabod.textContent = "";
  });

  flipSkra.addEventListener("click", () => {
    flipSkra.classList.add("virkur");
    flipInn.classList.remove("virkur");
    skraningForm.hidden = false;
    innskraningForm.hidden = true;
    villuskilabod.textContent = "";
  });

  innskraningForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    villuskilabod.textContent = "";
    try {
      await skraInn(
        document.getElementById("innEmail").value,
        document.getElementById("innPassword").value
      );
      window.location.href = "leikur.html";
    } catch (villa) {
      villuskilabod.textContent = thydaVillu(villa.code);
    }
  });

  skraningForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    villuskilabod.textContent = "";
    try {
      await skra(
        document.getElementById("skraEmail").value,
        document.getElementById("skraPassword").value,
        document.getElementById("skraNafn").value
      );
      window.location.href = "leikur.html";
    } catch (villa) {
      villuskilabod.textContent = thydaVillu(villa.code);
    }
  });

  function thydaVillu(code) {
    const skilabod = {
      "auth/email-already-in-use": "Netfangið er nú þegar skráð.",
      "auth/invalid-email": "Ógilt netfang.",
      "auth/weak-password": "Lykilorð þarf að vera minnst 6 stafir.",
      "auth/invalid-credential": "Rangt netfang eða lykilorð.",
      "auth/user-not-found": "Enginn notandi með þetta netfang.",
      "auth/wrong-password": "Rangt lykilorð."
    };
    return skilabod[code] || "Eitthvað fór úrskeiðis. Reyndu aftur.";
  }
</script>
</body>
</html>
