<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gettu Betur — Leikur</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="sida-haus">
  <div class="merki"><span>Gettu</span> Betur</div>
  <div class="notandi-svaedi">
    <span id="notandaNafn"></span>
    <button class="smabtn" id="utskraBtn">Skrá út</button>
  </div>
</header>

<main>
  <div id="verkefnaSvaedi">
    <h2>Verkefni</h2>
    <div id="verkefnaListi"></div>
  </div>

  <div id="glaeruSvaedi" hidden>
    <button type="button" class="smabtn" id="tilbakaFraGlaerum">← Öll verkefni</button>
    <h2 id="verkefnaTitill"></h2>
    <div id="glaerurInnihald"></div>
    <button type="button" class="aðal-hnappur" id="afromISpurningar">Áfram í spurningar</button>
  </div>

  <div id="spurningaSvaedi" hidden>
    <button type="button" class="smabtn" id="tilbakaFraSpurningum">← Öll verkefni</button>
    <p id="stodurNiðurstada"></p>
    <div id="spurningaListi"></div>
  </div>
</main>

<script type="module" src="js/quiz.js"></script>
</body>
</html>
